name: sahyfa-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sahyfa
      POSTGRES_USER: sahyfa
      POSTGRES_PASSWORD: sahyfa-dev-only
    ports:
      - "5433:5432"
    volumes:
      - sahyfa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahyfa -d sahyfa"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    volumes:
      - sahyfa_redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: sahyfa
      MINIO_ROOT_PASSWORD: sahyfa-dev-only
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - sahyfa_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  sahyfa_postgres_data:
  sahyfa_redis_data:
  sahyfa_minio_data:
